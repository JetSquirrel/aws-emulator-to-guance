# DataKit OpenTelemetry input — receives OTLP over HTTP on DataKit's port 9529:
#   http://127.0.0.1:9529/otel/v1/{traces,metrics,logs}
[[inputs.opentelemetry]]
  split_service_name = true
  log_max = 500
  jmarshaler = "protojson"
  clean_message = true

  ## Derive RED metrics (trace_hits, trace_errors, trace_latency, ...) from received spans
  tracing_metric_enable = true

  [inputs.opentelemetry.http]
    http_status_ok = 200
    trace_api = "/otel/v1/traces"
    metric_api = "/otel/v1/metrics"
    logs_api = "/otel/v1/logs"

  [inputs.opentelemetry.grpc]
    addr = "127.0.0.1:4317"   # unused here (HTTP is used); kept inside the container only
    max_payload = 16777216

  [inputs.opentelemetry.tags]
    lab = "aws-emulator"
